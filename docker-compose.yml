version: '3.8'

services:
  # ── Qdrant Vector Database ─────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: credit-policy-qdrant
    ports:
      - "6333:6333"    # REST API
      - "6334:6334"    # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped

  # ── FastAPI Backend ────────────────────────────────────────────────
  api:
    build: .
    container_name: credit-policy-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    depends_on:
      - qdrant
    restart: unless-stopped
    command: >
      python -m uvicorn src.api.main:app
      --host 0.0.0.0
      --port 8000
      --workers 2

  # ── Streamlit Frontend ─────────────────────────────────────────────
  frontend:
    build: .
    container_name: credit-policy-frontend
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped
    command: >
      streamlit run frontend/app.py
      --server.port=8501
      --server.address=0.0.0.0
      --server.headless=true

volumes:
  qdrant_data:
